name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: namello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. دریافت سورس پروژه
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. نصب Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. نصب Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. راه‌اندازی Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. نصب پلتفرم و ابزارهای Android
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            echo "ANDROID_HOME=${ANDROID_HOME}"
            find "${ANDROID_HOME}" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. بررسی فایل‌های اصلی پروژه
      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            package.json \
            index.html \
            vite.config.ts \
            capacitor.config.ts \
            version.json \
            assets/icon-only.png \
            scripts/set-android-version.mjs \
            scripts/verify-namello-version.mjs
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file not found: $f"
              exit 1
            fi
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));

          if (p.name !== 'namello-pwa') {
            throw new Error(`Unexpected package name: ${p.name}`);
          }

          for (const script of ['build', 'test', 'typecheck']) {
            if (!p.scripts?.[script]) {
              throw new Error(`Missing npm script: ${script}`);
            }
          }

          if (!v.version || !Number.isInteger(v.versionCode)) {
            throw new Error('Invalid version.json');
          }

          console.log(`Project: ${p.name}`);
          console.log(`Version: ${v.version}`);
          console.log(`Version code: ${v.versionCode}`);
          NODE

          echo "Repository layout verified."

      # 7. نصب وابستگی‌ها
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 8. بررسی هماهنگی نسخه‌ها
      - name: Verify Namello version
        run: node scripts/verify-namello-version.mjs

      # 9. اجرای تست‌ها
      - name: Run tests
        run: npm test

      # 10. بررسی TypeScript
      - name: TypeScript check
        run: npm run typecheck

      # 11. ساخت نسخه وب
      - name: Build web app
        run: npm run build

      # 12. بررسی خروجی Vite
      - name: Verify web output
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html

          echo "Web build output:"
          ls -lah dist

          for asset in \
            icon-dashboard-logo.png \
            icon-sessions.png \
            icon-journal.png \
            icon-mt5.jpg \
            icon-tradingview.png \
            icon-192.png \
            icon-512.png
          do
            if [ ! -s "dist/$asset" ]; then
              echo "ERROR: Missing build asset: dist/$asset"
              exit 1
            fi
          done

      # 13. ایجاد پروژه Android
      - name: Generate Android project
        run: npx cap add android

      # 14. تنظیم نسخه Android
      - name: Set Android version
        run: node scripts/set-android-version.mjs

      # 15. نصب آیکون Namello
      - name: Install Namello launcher icon
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"
          test -s "assets/icon-only.png"

          mkdir -p android/app/src/main/res/drawable-nodpi

          cp \
            assets/icon-only.png \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#' \
            "$MANIFEST"

          grep -q 'android:icon="@drawable/namello_launcher"' "$MANIFEST"

      # 16. همگام‌سازی Capacitor
      - name: Sync web assets to Android
        run: npx cap sync android

      # 17. بررسی Gradle Wrapper
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

      # 18. ساخت APK
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 19. بررسی APK تولیدشده
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"
          sha256sum "$APK"

      # 20. خواندن نسخه
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 21. بارگذاری APK برای دانلود
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-${{ steps.ver.outputs.version }}-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
