name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: namello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalise layout (fixes flat phone uploads)
        run: |
          set -eu
          mkdir -p backend src/modules tests scripts assets index_scripts public/index_scripts
          mv_if() { # $1 = file at repo root, $2 = destination folder
            if [ -f "$1" ]; then
              if [ -f "$2/$1" ]; then rm -f "$1"; else mv "$1" "$2/"; fi
            fi
          }
          for n in crypto csv-import portfolio prop-firm psychology replay statistics sync; do mv_if "$n.ts" src/modules; done
          for f in *.test.mjs; do mv_if "$f" tests; done
          for f in set-android-version.mjs verify-namello-version.mjs; do mv_if "$f" scripts; done
          for n in 0 1 2 3 4 12 16; do
            if [ -f "$n.js" ]; then [ -e "public/index_scripts/$n.js" ] || cp "$n.js" public/index_scripts/; mv_if "$n.js" index_scripts; fi
          done
          mv_if icon-only.png assets
          for f in server.mjs Caddyfile Dockerfile DEPLOYMENT.md docker-compose.yml docker-compose.local.yml; do mv_if "$f" backend; done
          for f in icon-*.png icon-*.jpg manifest*.json sw.js widget.html; do
            if [ -f "$f" ]; then [ -e "public/$f" ] || cp "$f" public/; fi
          done
          echo "Layout normalised."

      - name: Verify repository layout
        run: |
          set -eu
          for f in package.json index.html capacitor.config.ts version.json assets/icon-only.png; do
            test -f "$f" || { echo "ERROR: $f not found in repository root. Upload the CONTENTS of the zip to the repo root."; exit 1; }
          done
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")
          test "$NAME" = "namello-pwa" || { echo "ERROR: package.json is '$NAME' (probably backend/package.json). Upload the root package.json of the app (name: namello-pwa)."; exit 1; }
          echo "Repository layout OK."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          set +o pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify version consistency
        run: node scripts/verify-namello-version.mjs

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Verify web output
        run: |
          set -eu
          test -s dist/index.html
          for asset in icon-dashboard-logo.png icon-sessions.png icon-journal.png icon-mt5.jpg icon-tradingview.png icon-192.png icon-512.png; do
            test -s "dist/$asset" || { echo "Missing build asset: dist/$asset"; exit 1; }
          done

      - name: Generate Android project
        run: npx cap add android

      - name: Set Android version from version.json
        run: node scripts/set-android-version.mjs

      - name: Install Namello launcher icon
        run: |
          set -eu
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/icon-only.png android/app/src/main/res/drawable-nodpi/namello_launcher.png
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#' "$M"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#' "$M"
          grep -q 'android:icon="@drawable/namello_launcher"' "$M"

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -eu
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-${{ steps.ver.outputs.v }}-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
